<script>
  function renderGallery(targetId, folder, baseName, count) {
    const gallery = document.getElementById(targetId);
    for (let i = 1; i <= count; i++) {
      const col = document.createElement("div");
      col.className = "col-6 col-md-4 mb-4";

      const link = document.createElement("a");
      link.href = `gallery/${folder}/${baseName}${i}.jpg`;
      link.setAttribute("data-lightbox", folder);
      link.setAttribute("data-title", `${folder.charAt(0).toUpperCase() + folder.slice(1)} ${i}`);

      const img = document.createElement("img");
      img.src = `gallery/${folder}/${baseName}${i}.jpg`;
      img.alt = `${folder} ${i}`;
      img.className = "img-fluid rounded border";
	  img.loading = "lazy";

      link.appendChild(img);
      col.appendChild(link);
      gallery.appendChild(col);
    }
  }

  // Generate each section
  renderGallery("2021", "2021", "2021", 13);
  renderGallery("2019", "2019", "2019", 17);
  renderGallery("2018", "2018", "2018", 7);
  renderGallery("2025", "2025", "2025", 23);
</script>
